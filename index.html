<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JACK22 STUDIO</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#f5f5f5;background:#101014}*{box-sizing:border-box}body{margin:0}.app{max-width:1100px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{font-size:28px;letter-spacing:2px;margin:0}h1 span{color:#ff4545}.sub{color:#999;font-size:13px}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:12px 17px;background:#292932;color:#fff}button:hover{filter:brightness(1.2)}button.primary{background:#e3313d;font-weight:700}.transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:28px 0;background:#1b1b22;padding:16px;border-radius:12px}input[type=number]{width:75px;background:#111116;border:1px solid #444;color:white;padding:10px;border-radius:7px}.panel{background:#1b1b22;padding:20px;border-radius:14px;overflow-x:auto}.legend{display:grid;grid-template-columns:105px repeat(16,minmax(32px,1fr));gap:7px;min-width:780px;margin-bottom:10px;color:#999;font-size:12px;text-align:center}.track{display:grid;grid-template-columns:105px repeat(16,minmax(32px,1fr));gap:7px;align-items:center;min-width:780px;margin-bottom:12px}.track-label{font-weight:700;font-size:13px}.step{aspect-ratio:1;border-radius:6px;background:#34343d;padding:0;border:1px solid #45454e}.step.active{background:#e3313d;border-color:#ff6c74}.step.playing{outline:3px solid #fff;outline-offset:1px}.step.beat{background:#454550}.step.beat.active{background:#f0444e}footer{color:#777;font-size:12px;margin-top:20px}.status{color:#bbb;font-size:13px}
</style></head><body><main class="app"><header><div><h1>JACK<span>22</span> STUDIO</h1><div class="sub">J-DRUMS · BEATMAKER V1</div></div><div class="sub">JACK22 AI LAB</div></header><div class="transport"><button class="primary" id="play">▶ Play</button><button id="stop">■ Stop</button><label for="bpm">BPM</label><input id="bpm" type="number" min="40" max="240" value="120"><button id="save">Sauvegarder</button><button id="load">Charger</button><button id="clear">Effacer</button><span class="status" id="status">Prêt</span></div><section class="panel"><div class="legend"><div>INSTRUMENT</div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div><div>10</div><div>11</div><div>12</div><div>13</div><div>14</div><div>15</div><div>16</div></div><div id="tracks"></div></section><footer>Les sons sont synthétisés localement avec Web Audio. Aucun compte ni abonnement nécessaire.</footer></main><script>
const names=['KICK','SNARE','HI-HAT','CLAP'];const pattern=names.map(()=>Array(16).fill(false));[0,4,8,12].forEach(i=>pattern[0][i]=true);[4,12].forEach(i=>pattern[1][i]=true);[0,2,4,6,8,10,12,14].forEach(i=>pattern[2][i]=true);let audio,noiseBuffer,playing=false,step=0,nextTime=0,timer=null;const $=id=>document.getElementById(id);const tracks=$('tracks');function render(){tracks.innerHTML='';names.forEach((name,r)=>{const row=document.createElement('div');row.className='track';const label=document.createElement('div');label.className='track-label';label.textContent=name;row.append(label);for(let c=0;c<16;c++){const b=document.createElement('button');b.className='step'+(c%4===0?' beat':'')+(pattern[r][c]?' active':'');b.setAttribute('aria-label',`${name} pas ${c+1}`);b.setAttribute('aria-pressed',String(pattern[r][c]));b.onclick=()=>{pattern[r][c]=!pattern[r][c];b.classList.toggle('active',pattern[r][c]);b.setAttribute('aria-pressed',String(pattern[r][c]))};row.append(b)}tracks.append(row)})}function initAudio(){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();noiseBuffer=audio.createBuffer(1,audio.sampleRate,audio.sampleRate);const data=noiseBuffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1}if(audio.state==='suspended')audio.resume()}function env(g,t,peak,dur){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+dur)}function tone(t,f0,f1,dur,peak){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);env(g,t,peak,dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur+0.02)}function noise(t,dur,peak,highpass){const s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();s.buffer=noiseBuffer;f.type='highpass';f.frequency.value=highpass;env(g,t,peak,dur);s.connect(f).connect(g).connect(audio.destination);s.start(t);s.stop(t+dur+0.02)}function hit(r,t){if(r===0)tone(t,155,42,.24,.85);if(r===1){noise(t,.17,.32,1100);tone(t,190,110,.12,.18)}if(r===2)noise(t,.055,.16,7000);if(r===3){noise(t,.12,.25,1500);noise(t+.018,.09,.12,1500)}}function highlight(c){document.querySelectorAll('.step').forEach((b,i)=>b.classList.toggle('playing',playing&&i%16===c))}function schedule(){if(!playing)return;const bpm=Math.max(40,Math.min(240,Number($('bpm').value)||120));while(nextTime<audio.currentTime+.12){const current=step;names.forEach((_,r)=>{if(pattern[r][current])hit(r,nextTime)});const delay=Math.max(0,(nextTime-audio.currentTime)*1000);setTimeout(()=>{if(playing)highlight(current)},delay);nextTime+=60/bpm/4;step=(step+1)%16}}function stop(){playing=false;clearInterval(timer);timer=null;highlight(-1);$('play').textContent='▶ Play';$('status').textContent='Arrêté'}$('play').onclick=async()=>{if(playing){stop();return}initAudio();await audio.resume();playing=true;step=0;nextTime=audio.currentTime+.05;$('play').textContent='Ⅱ Pause';$('status').textContent='Lecture';schedule();timer=setInterval(schedule,25)};$('stop').onclick=stop;$('save').onclick=()=>{localStorage.setItem('jack22-pattern-v1',JSON.stringify({pattern,bpm:$('bpm').value}));$('status').textContent='Rythme sauvegardé'};$('load').onclick=()=>{try{const saved=JSON.parse(localStorage.getItem('jack22-pattern-v1'));if(!saved||!Array.isArray(saved.pattern)||saved.pattern.length!==4||!saved.pattern.every(x=>Array.isArray(x)&&x.length===16))throw Error();saved.pattern.forEach((row,i)=>row.forEach((v,j)=>pattern[i][j]=!!v));$('bpm').value=saved.bpm||120;render();$('status').textContent='Rythme chargé'}catch{$('status').textContent='Aucune sauvegarde valide'}};$('clear').onclick=()=>{pattern.forEach(row=>row.fill(false));render();$('status').textContent='Rythme effacé'};render();
</script></body></html>
