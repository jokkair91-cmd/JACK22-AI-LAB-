<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JACK22 habillage avant/après</title>
<style>
:root{--bg:#111214;--panel:#17181b;--text:#e9e9ec;--muted:#a0a4ab;--red:#c8323a;--line:rgba(255,255,255,.08)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f4f5;--panel:#fff;--text:#18181b;--muted:#52525b;--line:rgba(0,0,0,.1)}}
:root[data-theme="light"]{--bg:#f4f4f5;--panel:#fff;--text:#18181b;--muted:#52525b;--line:rgba(0,0,0,.1)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:1500px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}h1 span{color:var(--red)}
p.lead{color:var(--muted);margin:0 0 24px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 20px}
h2{font-size:16px;margin:0 0 10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
figure{margin:0}figcaption{font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
img{width:100%;height:auto;border-radius:6px;border:1px solid var(--line);display:block}
@media (max-width:760px){.pair{grid-template-columns:1fr}}
</style></head><body><main>
<h1>JACK22 <span>·</span> habillage avant / après</h1>
<p class="lead">Captures prises par Edge 156 depuis le fichier livré, à 1233 × 690, avec le contenu de démonstration (#écran-demo). Même disposition, mêmes commandes : seul l'habillage change.</p>
<section><h2>1. Studio (Arrangement)</h2><div class="pair"><figure><figcaption>Avant</figcaption><img src="avant-1-studio.png" alt="Studio avant"></figure><figure><figcaption>Après</figcaption><img src="apres-1-studio.png" alt="Studio après"></figure></div></section>
<section><h2>2. Batterie</h2><div class="pair"><figure><figcaption>Avant</figcaption><img src="avant-2-batterie.png" alt="Batterie avant"></figure><figure><figcaption>Après</figcaption><img src="apres-2-batterie.png" alt="Batterie après"></figure></div></section>
<section><h2>3. Piano Roll</h2><div class="pair"><figure><figcaption>Avant</figcaption><img src="avant-3-pianoroll.png" alt="Piano Roll avant"></figure><figure><figcaption>Après</figcaption><img src="apres-3-pianoroll.png" alt="Piano Roll après"></figure></div></section>
<section><h2>4. Voix &amp; texte</h2><div class="pair"><figure><figcaption>Avant</figcaption><img src="avant-4-voix.png" alt="Voix avant"></figure><figure><figcaption>Après</figcaption><img src="apres-4-voix.png" alt="Voix après"></figure></div></section>
<section><h2>5. Console</h2><div class="pair"><figure><figcaption>Avant</figcaption><img src="avant-5-console.png" alt="Console avant"></figure><figure><figcaption>Après</figcaption><img src="apres-5-console.png" alt="Console après"></figure></div></section>
</main></body></html>
