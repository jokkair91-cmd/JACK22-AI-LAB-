<iframe id="f"></iframe><script>
const q=new URLSearchParams(location.search),f=document.getElementById('f');f.src=q.get('url');
f.onload=()=>setTimeout(()=>{const W=f.contentWindow;try{W.localStorage.setItem('jack22.pianoRoll.grand','0')}catch(e){}
